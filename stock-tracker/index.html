<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票数据追踪 - 实时美股数据查询</title>
    <meta name="description" content="实时美股数据查询与分析工具">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #2e7d32;
            --danger-color: #c62828;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        
        .stock-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stock-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px 30px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 15px;
            color: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        
        .stock-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
            font-weight: 700;
        }
        
        .stock-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        /* 搜索框 */
        .search-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .search-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .search-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 快捷标签 */
        .quick-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .quick-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .quick-tag:hover {
            background: var(--primary-color);
            color: white;
        }
        
        /* 市场指数卡片 */
        .market-indices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .index-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.2s;
            cursor: pointer;
        }
        
        .index-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.12);
        }
        
        .index-name {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .index-price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .index-change {
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .change-up {
            background: #e8f5e9;
            color: var(--success-color);
        }
        
        .change-down {
            background: #ffebee;
            color: var(--danger-color);
        }
        
        /* 股票信息卡片 */
        .stock-info-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .stock-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stock-name h2 {
            margin: 0 0 5px 0;
            font-size: 1.8em;
        }
        
        .stock-symbol {
            color: #888;
            font-size: 14px;
        }
        
        .stock-price-main {
            text-align: right;
        }
        
        .current-price {
            font-size: 42px;
            font-weight: bold;
            margin: 0;
        }
        
        .price-change {
            font-size: 18px;
            margin: 5px 0 0 0;
        }
        
        .stock-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .detail-item {
            text-align: center;
        }
        
        .detail-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 16px;
            font-weight: 600;
        }
        
        /* 图表区域 */
        .chart-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        
        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .period-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .period-btn:hover,
        .period-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .chart-container {
            height: 400px;
            position: relative;
        }
        
        /* 数据表格 */
        .data-table-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        /* 搜索结果 */
        .search-results {
            margin-top: 15px;
        }
        
        .result-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .result-item:hover {
            background: #e9ecef;
        }
        
        .result-symbol {
            font-weight: bold;
            font-size: 18px;
        }
        
        .result-name {
            color: #666;
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 错误提示 */
        .error-message {
            padding: 20px;
            background: #ffebee;
            color: var(--danger-color);
            border-radius: 8px;
            margin: 20px 0;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .stock-header h1 {
                font-size: 1.8em;
            }
            
            .current-price {
                font-size: 32px;
            }
            
            .stock-title {
                flex-direction: column;
            }
            
            .stock-price-main {
                text-align: left;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="stock-container">
        <!-- 头部 -->
        <div class="stock-header">
            <h1>📈 股票数据追踪</h1>
            <p>实时美股数据查询 · 历史价格分析 · 市场动态监控</p>
        </div>

        <!-- 搜索区域 -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="stockInput" placeholder="输入股票代码，如 AAPL、MSFT、TSLA..." onkeypress="if(event.key==='Enter')searchStock()">
                <button class="search-btn" id="searchBtn" onclick="searchStock()">🔍 查询</button>
            </div>
            <div class="quick-tags">
                <span class="quick-tag" onclick="loadStock('AAPL')">AAPL</span>
                <span class="quick-tag" onclick="loadStock('MSFT')">MSFT</span>
                <span class="quick-tag" onclick="loadStock('GOOGL')">GOOGL</span>
                <span class="quick-tag" onclick="loadStock('AMZN')">AMZN</span>
                <span class="quick-tag" onclick="loadStock('TSLA')">TSLA</span>
                <span class="quick-tag" onclick="loadStock('NVDA')">NVDA</span>
                <span class="quick-tag" onclick="loadStock('META')">META</span>
                <span class="quick-tag" onclick="loadStock('BABA')">BABA</span>
                <span class="quick-tag" onclick="loadStock('SPY')">SPY</span>
                <span class="quick-tag" onclick="loadStock('QQQ')">QQQ</span>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- 市场指数 -->
        <div class="market-indices" id="marketIndices">
            <div class="loading"><div class="spinner"></div></div>
        </div>

        <!-- 股票详情 -->
        <div id="stockDetail"></div>

        <!-- 图表区域 -->
        <div class="chart-section" id="chartSection" style="display:none;">
            <h3 class="section-title">📊 价格走势</h3>
            <div class="chart-controls">
                <button class="period-btn" onclick="changePeriod('1mo')">1月</button>
                <button class="period-btn active" onclick="changePeriod('3mo')">3月</button>
                <button class="period-btn" onclick="changePeriod('6mo')">6月</button>
                <button class="period-btn" onclick="changePeriod('1y')">1年</button>
                <button class="period-btn" onclick="changePeriod('5y')">5年</button>
            </div>
            <div class="chart-container" id="stockChart"></div>
        </div>

        <!-- 历史数据表格 -->
        <div class="data-table-section" id="tableSection" style="display:none;">
            <h3 class="section-title">📋 历史数据</h3>
            <div style="overflow-x:auto;">
                <table class="data-table" id="historyTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>开盘价</th>
                            <th>最高价</th>
                            <th>最低价</th>
                            <th>收盘价</th>
                            <th>成交量</th>
                            <th>涨跌幅</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <script>
    // API 基础地址
    const API_BASE = 'https://factor.zoengsang.cloud';

    let currentSymbol = '';
    let currentPeriod = '3mo';
    let chartInstance = null;

    // 页面加载时获取市场指数
    document.addEventListener('DOMContentLoaded', function() {
        loadMarketIndices();
    });

    // 备用静态数据
    const staticMarketData = [
        {symbol: "SPY", name: "标普500", price: 580.50, change: 1.25, change_percent: 0.22},
        {symbol: "QQQ", name: "纳斯达克100", price: 505.20, change: 2.80, change_percent: 0.56},
        {symbol: "DIA", name: "道琼斯工业", price: 430.15, change: 0.75, change_percent: 0.17},
        {symbol: "IWM", name: "罗素2000", price: 226.80, change: -0.45, change_percent: -0.20},
        {symbol: "VIX", name: "波动率指数", price: 13.50, change: -0.25, change_percent: -1.82}
    ];
    
    // 加载市场指数
    async function loadMarketIndices() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000); // 15秒超时
            
            const response = await fetch(`${API_BASE}/api/stock/markets`, {
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            const result = await response.json();
            
            if (result.success && result.data && result.data.length > 0) {
                displayMarketData(result.data, result.source === 'static');
            } else {
                // 使用备用数据
                displayMarketData(staticMarketData, true);
            }
        } catch (error) {
            console.error('获取市场指数失败:', error);
            // 使用备用静态数据
            displayMarketData(staticMarketData, true);
        }
    }
    
    // 显示市场数据
    function displayMarketData(data, isStatic = false) {
        const container = document.getElementById('marketIndices');
        let html = '';
        
        if (isStatic) {
            html += `<div style="grid-column: 1/-1; text-align: center; color: #888; font-size: 12px; margin-bottom: 10px;">当前显示参考数据，点击卡片查询实时价格</div>`;
        }
        
        data.forEach(index => {
            const changeClass = index.change >= 0 ? 'change-up' : 'change-down';
            const changeSign = index.change >= 0 ? '+' : '';
            
            html += `
                <div class="index-card" onclick="loadStock('${index.symbol}')" style="cursor:pointer;">
                    <div class="index-name">${index.name}</div>
                    <div class="index-price">${index.price.toLocaleString()}</div>
                    <div class="index-change ${changeClass}">
                        ${changeSign}${index.change} (${changeSign}${index.change_percent}%)
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }

    // 搜索股票
    async function searchStock() {
        const input = document.getElementById('stockInput');
        const symbol = input.value.trim().toUpperCase();
        
        if (!symbol) {
            alert('请输入股票代码');
            return;
        }
        
        loadStock(symbol);
    }

    // 加载股票数据
    async function loadStock(symbol) {
        currentSymbol = symbol;
        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = '加载中...';
        
        try {
            // 并行获取股票信息和价格数据
            const [infoRes, priceRes, historyRes] = await Promise.all([
                fetch(`${API_BASE}/api/stock/info/${symbol}`),
                fetch(`${API_BASE}/api/stock/realtime/${symbol}`),
                fetch(`${API_BASE}/api/stock/history/${symbol}?period=${currentPeriod}`)
            ]);
            
            const infoData = await infoRes.json();
            const priceData = await priceRes.json();
            const historyData = await historyRes.json();
            
            // 显示股票详情
            if (infoData.success && priceData.success) {
                displayStockDetail(infoData.data, priceData.data);
            }
            
            // 显示图表和历史数据
            if (historyData.success) {
                displayChart(historyData.data);
                displayHistoryTable(historyData.data);
            }
            
            // 显示图表和表格区域
            document.getElementById('chartSection').style.display = 'block';
            document.getElementById('tableSection').style.display = 'block';
            
            // 清空搜索结果
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('stockInput').value = symbol;
            
        } catch (error) {
            console.error('加载股票数据失败:', error);
            document.getElementById('stockDetail').innerHTML = `
                <div class="error-message">
                    获取 ${symbol} 数据失败，请检查股票代码是否正确
                </div>
            `;
        } finally {
            btn.disabled = false;
            btn.textContent = '🔍 查询';
        }
    }

    // 显示股票详情
    function displayStockDetail(info, price) {
        const changeClass = price.change >= 0 ? 'change-up' : 'change-down';
        const changeSign = price.change >= 0 ? '+' : '';
        const marketCap = info.market_cap ? (info.market_cap / 1e12).toFixed(2) + 'T' : '-';
        
        const html = `
            <div class="stock-info-card">
                <div class="stock-title">
                    <div class="stock-name">
                        <h2>${info.name || info.symbol}</h2>
                        <div class="stock-symbol">${info.symbol} · ${info.market || 'NASDAQ'} · ${info.sector || '未知行业'}</div>
                    </div>
                    <div class="stock-price-main">
                        <div class="current-price">$${price.price}</div>
                        <div class="price-change ${changeClass}">
                            ${changeSign}${price.change} (${changeSign}${price.change_percent}%)
                        </div>
                    </div>
                </div>
                <div class="stock-details">
                    <div class="detail-item">
                        <div class="detail-label">今开</div>
                        <div class="detail-value">$${price.open}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">最高</div>
                        <div class="detail-value">$${price.high}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">最低</div>
                        <div class="detail-value">$${price.low}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">成交量</div>
                        <div class="detail-value">${(price.volume / 1e6).toFixed(2)}M</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">市值</div>
                        <div class="detail-value">${marketCap}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">市盈率</div>
                        <div class="detail-value">${info.pe_ratio ? info.pe_ratio.toFixed(2) : '-'}</div>
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('stockDetail').innerHTML = html;
    }

    // 显示图表
    function displayChart(data) {
        const chartDom = document.getElementById('stockChart');
        
        if (!chartInstance) {
            chartInstance = echarts.init(chartDom);
            window.addEventListener('resize', () => chartInstance.resize());
        }
        
        // 提取数据
        const dates = data.map(item => item.date);
        const prices = data.map(item => [item.open, item.close, item.low, item.high]);
        const volumes = data.map(item => item.volume);
        
        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'cross' },
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: '#ccc',
                borderWidth: 1,
                textStyle: { color: '#333' }
            },
            legend: {
                data: ['K线', '成交量'],
                top: 10
            },
            grid: [
                { left: '10%', right: '8%', height: '50%' },
                { left: '10%', right: '8%', top: '68%', height: '16%' }
            ],
            xAxis: [
                {
                    type: 'category',
                    data: dates,
                    scale: true,
                    boundaryGap: false,
                    axisLine: { lineStyle: { color: '#888' } },
                    splitLine: { show: false },
                    min: 'dataMin',
                    max: 'dataMax'
                },
                {
                    type: 'category',
                    gridIndex: 1,
                    data: dates,
                    axisLabel: { show: false }
                }
            ],
            yAxis: [
                {
                    scale: true,
                    splitArea: { show: true },
                    axisLine: { lineStyle: { color: '#888' } },
                    splitLine: { lineStyle: { color: '#eee' } }
                },
                {
                    scale: true,
                    gridIndex: 1,
                    splitNumber: 2,
                    axisLabel: { show: false },
                    axisLine: { show: false },
                    splitLine: { show: false }
                }
            ],
            dataZoom: [
                { type: 'inside', xAxisIndex: [0, 1], start: 50, end: 100 },
                { show: true, xAxisIndex: [0, 1], type: 'slider', top: '85%', start: 50, end: 100 }
            ],
            series: [
                {
                    name: 'K线',
                    type: 'candlestick',
                    data: prices,
                    itemStyle: {
                        color: '#ef5350',
                        color0: '#26a69a',
                        borderColor: '#ef5350',
                        borderColor0: '#26a69a'
                    }
                },
                {
                    name: '成交量',
                    type: 'bar',
                    xAxisIndex: 1,
                    yAxisIndex: 1,
                    data: volumes,
                    itemStyle: {
                        color: (params) => {
                            const close = prices[params.dataIndex][1];
                            const open = prices[params.dataIndex][0];
                            return close >= open ? '#ef5350' : '#26a69a';
                        }
                    }
                }
            ]
        };
        
        chartInstance.setOption(option, true);
    }

    // 显示历史数据表格
    function displayHistoryTable(data) {
        const tbody = document.querySelector('#historyTable tbody');
        
        // 只显示最近30条数据，并倒序排列
        const recentData = data.slice(-30).reverse();
        
        let html = '';
        recentData.forEach(item => {
            const changeClass = item.change_percent >= 0 ? 'change-up' : 'change-down';
            const changeSign = item.change_percent >= 0 ? '+' : '';
            
            html += `
                <tr>
                    <td>${item.date}</td>
                    <td>$${item.open.toFixed(2)}</td>
                    <td>$${item.high.toFixed(2)}</td>
                    <td>$${item.low.toFixed(2)}</td>
                    <td>$${item.close.toFixed(2)}</td>
                    <td>${(item.volume / 1e6).toFixed(2)}M</td>
                    <td class="${changeClass}">${changeSign}${item.change_percent.toFixed(2)}%</td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
    }

    // 切换时间周期
    async function changePeriod(period) {
        if (!currentSymbol) return;
        
        currentPeriod = period;
        
        // 更新按钮状态
        document.querySelectorAll('.period-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent.includes(getPeriodText(period))) {
                btn.classList.add('active');
            }
        });
        
        try {
            const response = await fetch(`${API_BASE}/api/stock/history/${currentSymbol}?period=${period}`);
            const result = await response.json();
            
            if (result.success) {
                displayChart(result.data);
                displayHistoryTable(result.data);
            }
        } catch (error) {
            console.error('加载历史数据失败:', error);
        }
    }

    // 获取周期显示文本
    function getPeriodText(period) {
        const map = {
            '1mo': '1月',
            '3mo': '3月',
            '6mo': '6月',
            '1y': '1年',
            '5y': '5年'
        };
        return map[period] || period;
    }
    </script>
</body>
</html>
